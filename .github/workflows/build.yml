name: Build and Test

# Runner placement (since 2026-05-22, RTest CI appserver migration):
#   - Jobs run on the self-hosted appserver runner (labels:
#     [self-hosted, linux, x64, appserver]) — eliminates the GH Actions
#     monthly-quota dependency that surfaced during the cast/BT research
#     arc Phase 1 rollout.
#   - This is the heaviest of the four migrated workflows: dotnet build +
#     dotnet test across 11 test projects + Playwright browser install
#     (--with-deps, needs apt) + NuGet pack of 5 packages. .NET 10 SDK is
#     installed per-job via actions/setup-dotnet@v4; pwsh and Playwright
#     system deps resolve via apt inside the ephemeral runner container.
#   - CI is ADVISORY: main branch protection is off; the Builder's local
#     gates (dotnet build / dotnet test) are the merge-blocking truth.
#     CI here is a second-opinion signal.
#   - Rollback: revert this PR — runs-on flips back to ubuntu-latest.
#
# audio-uat.yml stays on windows-latest (intentional — Windows-only
# feature surface; appserver runner is Linux).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, appserver]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install native audio libraries
        # libsamplerate0 is required at test time by SrcVariableResamplerTests
        # (Path D — docs/plans/2026-05-22-bt-input-resampler.md). The
        # myoung34/github-runner:ubuntu-noble base image does not include it;
        # `apt install` is idempotent so it is safe even if a future runner
        # update bundles it. LGPL, ~150 KB, installs in <1 s.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsamplerate0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Install Playwright Browsers
        run: pwsh tests/Radio.Web.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps
        continue-on-error: false
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~Radio.Web.E2ETests&Category!=Integration"
      - name: Pack NuGet packages
        run: |
          dotnet pack src/RTLSDRCore/RTLSDRCore.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/Radio.AudioAnalysis/Radio.AudioAnalysis.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/Radio.Metrics/Radio.Metrics.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/Radio.Configuration/Radio.Configuration.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/Radio.Fingerprinting/Radio.Fingerprinting.csproj --no-build --configuration Release --output ./packages
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          if-no-files-found: warn
