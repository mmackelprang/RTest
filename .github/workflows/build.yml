name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Install Playwright Browsers
        run: pwsh tests/Radio.Web.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps
        continue-on-error: false
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~Radio.Web.E2ETests&Category!=Integration"
      - name: Pack NuGet packages
        run: dotnet pack src/RTLSDRCore/RTLSDRCore.csproj --no-build --configuration Release --output ./packages
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          if-no-files-found: warn
