<!--                                                                                                -->
<!-- The name was kept deliberately on the owner's decision: this path is cited eleven times across  -->
<!-- six documents (HANDOFF-rotary-encoder-mapping.md calls it "the single source of truth" and      -->
<!-- "every value here is measured from" it; also HANDOFF-GA-PUNCH-LIST.md, INTEGRATIONS.md,         -->
<!-- WORK-LOG.md, plans/ENC-4-encoder-hud.md, BUILDER_QUEUE.md). Renaming would have been an         -->
<!-- eleven-site edit; replacing in place keeps every citation resolving. The cost is this comment.  -->
<!--                                                                                                -->
