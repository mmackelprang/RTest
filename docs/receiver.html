<!DOCTYPE html>
<!--
  Custom Web Receiver for Radio Console — Low-Latency Live Audio Streaming

  This receiver uses the Cast Application Framework (CAF) to stream live
  MP3 audio with minimal buffering delay.

  SETUP:
  1. Host this file on a public HTTPS URL (e.g., GitHub Pages)
  2. Register a Custom Receiver app at https://cast.google.com/publish/
  3. Update appsettings.json: AudioOutput.GoogleCast.ApplicationId = "<your-app-id>"
  4. Restart Radio.API

  DEFAULT MEDIA RECEIVER PROBLEM:
  The default receiver (CC1AD845) has a ~20s audio prefill buffer before
  playback starts. This custom receiver reduces that to ~2-5 seconds using:
  - autoResumeDuration = 1 (start playback after 1s of buffered audio)
  - LOAD interceptor to enforce StreamType.LIVE
  - Idle timeout disabled (keeps receiver alive for continuous streams)
-->
<html>
<head>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    body { margin: 0; }
    cast-media-player { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // Log receiver lifecycle for remote debugging
    console.log('[RadioConsole] Custom receiver starting');

    // Intercept LOAD requests to enforce LIVE stream type.
    // Prevents the player from trying to determine content length
    // or buffering the entire stream before playback.
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => {
        console.log('[RadioConsole] LOAD intercepted:', JSON.stringify({
          contentId: request.media?.contentId,
          contentType: request.media?.contentType,
          streamType: request.media?.streamType
        }));
        if (request.media) {
          request.media.streamType = cast.framework.messages.StreamType.LIVE;
        }
        return request;
      }
    );

    // Log player state changes for debugging
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
      () => console.log('[RadioConsole] Player load complete — playback should start')
    );
    playerManager.addEventListener(
      cast.framework.events.EventType.BUFFERING,
      event => console.log('[RadioConsole] Buffering:', event.isBuffering)
    );
    playerManager.addEventListener(
      cast.framework.events.EventType.ERROR,
      event => console.error('[RadioConsole] Player error:', JSON.stringify(event))
    );

    // Configure low-latency playback.
    // PlaybackConfig constructor takes no arguments — set properties individually.
    const playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.autoResumeDuration = 1;   // Resume/start playback after 1s of buffered audio
    playbackConfig.autoPauseDuration = 0.5;  // Pause to buffer when less than 0.5s remains

    console.log('[RadioConsole] PlaybackConfig:', JSON.stringify({
      autoResumeDuration: playbackConfig.autoResumeDuration,
      autoPauseDuration: playbackConfig.autoPauseDuration
    }));

    context.start({
      playbackConfig: playbackConfig,
      disableIdleTimeout: true  // Keep receiver alive for continuous streams
    });

    console.log('[RadioConsole] Receiver context started');
  </script>
</body>
</html>
