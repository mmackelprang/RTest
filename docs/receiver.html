<!DOCTYPE html>
<!--
  Custom Web Receiver for Radio Console — Low-Latency Live Audio Streaming

  This receiver uses the Cast Application Framework (CAF) to stream live
  MP3 audio with minimal buffering delay.

  APPROACH:
  Chrome's native <video>/<audio> element buffers ~20s before starting playback
  on infinite streams. We bypass this by:
  1. Intercepting LOAD to enforce StreamType.LIVE
  2. Monitoring the media element's buffer via 'progress' events
  3. Force-calling play() as soon as ~1s of audio is buffered
  This reduces startup latency from ~20s to ~4-5s.
-->
<html>
<head>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    body { margin: 0; }
    cast-media-player { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    console.log('[RadioConsole] Custom receiver starting');

    // Intercept LOAD requests to enforce LIVE stream type
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => {
        console.log('[RadioConsole] LOAD intercepted:', JSON.stringify({
          contentId: request.media?.contentId,
          contentType: request.media?.contentType,
          streamType: request.media?.streamType
        }));
        if (request.media) {
          request.media.streamType = cast.framework.messages.StreamType.LIVE;
        }

        // After CAF sets up the media element, force early playback.
        // Chrome normally buffers ~20s before starting; we force play() after
        // building a sufficient buffer. The server delivers at ~1.1x real-time,
        // so we need enough buffer to avoid rebuffering during initial playback.
        // 3s buffer = ~3s latency but smooth audio from the start.
        setTimeout(function() {
          var cmp = document.querySelector('cast-media-player');
          var sr = cmp && cmp.shadowRoot;
          var media = sr && (sr.querySelector('video') || sr.querySelector('audio'));
          if (media) {
            console.log('[RadioConsole] Found media element:', media.tagName,
              'readyState:', media.readyState, 'paused:', media.paused);

            var forcePlayAttempts = 0;
            var forcePlayInterval = setInterval(function() {
              forcePlayAttempts++;
              var bufferedEnd = media.buffered.length > 0 ? media.buffered.end(0) : 0;
              console.log('[RadioConsole] Buffer check #' + forcePlayAttempts +
                ': buffered=' + bufferedEnd.toFixed(2) + 's, readyState=' + media.readyState +
                ', paused=' + media.paused + ', currentTime=' + media.currentTime.toFixed(2));

              // Force play once we have >= 3 seconds of buffered audio.
              // This provides enough cushion for smooth playback since the
              // server delivers data at only ~1.1x real-time rate.
              if (bufferedEnd >= 3.0 && media.paused) {
                console.log('[RadioConsole] Forcing play() at ' + bufferedEnd.toFixed(2) + 's buffered');
                media.play().then(function() {
                  console.log('[RadioConsole] Force play() succeeded!');
                }).catch(function(e) {
                  console.error('[RadioConsole] Force play() failed:', e.message);
                });
                clearInterval(forcePlayInterval);
              }

              // Give up after 60 attempts (30 seconds)
              if (forcePlayAttempts >= 60) {
                console.log('[RadioConsole] Giving up on force play, letting CAF handle it');
                clearInterval(forcePlayInterval);
              }
            }, 500);

        return request;
      }
    );

    // Log player state changes for debugging
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
      function() { console.log('[RadioConsole] Player load complete'); }
    );
    playerManager.addEventListener(
      cast.framework.events.EventType.BUFFERING,
      function(event) { console.log('[RadioConsole] Buffering:', event.isBuffering); }
    );
    playerManager.addEventListener(
      cast.framework.events.EventType.ERROR,
      function(event) { console.error('[RadioConsole] Player error:', JSON.stringify(event)); }
    );

    // PlaybackConfig — these control Shaka/CAF resume behavior
    var playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.autoResumeDuration = 1;
    playbackConfig.autoPauseDuration = 0.5;

    context.start({
      playbackConfig: playbackConfig,
      disableIdleTimeout: true
    });

    console.log('[RadioConsole] Receiver context started');
  </script>
</body>
</html>
