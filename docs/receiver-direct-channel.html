<!DOCTYPE html>
<!--
  Direct Channel Cast Receiver for Radio Console
  ================================================
  Custom CAF (Cast Application Framework) receiver that receives audio data
  directly over the Cast protocol's custom message bus, bypassing HTTP entirely.

  How it works:
  1. The sender (Radio Console API) launches this receiver on the Cast device
  2. Audio chunks arrive as JSON messages on a custom namespace:
     { "type": "audio", "data": "<base64-encoded-WAV>", "seq": N }
  3. Each chunk is a self-contained WAV file (44-byte header + PCM data)
  4. Web Audio API decodes each chunk and schedules it for gapless playback
  5. Chunks are queued and played sequentially using AudioBufferSourceNode.start(time)

  Requirements:
  - Register this HTML as a Custom Receiver Application on the Google Cast SDK
    Developer Console: https://cast.google.com/publish/
  - Set the registered App ID in appsettings.json: AudioOutput:GoogleCast:ApplicationId
  - Set StreamingMode to "DirectChannel" in appsettings.json

  For detailed setup instructions, see: docs/direct-channel-setup-guide.md

  Audio parameters (must match sender):
  - 48kHz sample rate, 16-bit, stereo
  - Default chunk size: 100ms (~19.2KB PCM, ~25.7KB Base64)

  See also: design/direct-cast-channel.md for full architecture documentation.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Radio Console Direct Channel Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <!-- No <cast-media-player> element — we handle audio entirely via Web Audio API -->
  <div id="status" style="color: #ccc; font-family: monospace; padding: 20px;">
    Radio Console — Direct Channel Receiver<br>
    <span id="info">Waiting for audio...</span>
  </div>

  <script>
    'use strict';

    // Configuration — namespace must match sender's DirectChannelNamespace setting
    const NAMESPACE = 'urn:x-cast:com.radioconsole.audio';

    // Web Audio API context for decoding and scheduling audio playback
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 48000
    });

    // Playback scheduling state
    let nextPlayTime = 0;       // When to schedule the next buffer (in audioCtx.currentTime units)
    let chunksReceived = 0;     // Total chunks received (for logging)
    let chunksPlayed = 0;       // Total chunks decoded and scheduled
    let lastSeq = -1;           // Last sequence number received (for gap detection)

    // CAF receiver context
    const context = cast.framework.CastReceiverContext.getInstance();

    // Disable idle timeout — there's no media session, so the default 5-minute
    // idle timeout would shut down the receiver. Audio arrives via messages, not media.
    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;

    // CRITICAL: Declare custom namespaces in options. CAF v3 requires explicit
    // namespace registration — without this, addCustomMessageListener silently
    // receives nothing because the framework drops messages on unknown namespaces.
    options.customNamespaces = {};
    options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;

    // Listen for audio chunks on our custom namespace
    context.addCustomMessageListener(NAMESPACE, (event) => {
      const msg = event.data;

      if (msg.type === 'audio' && msg.data) {
        chunksReceived++;

        // Detect sequence gaps
        if (lastSeq >= 0 && msg.seq !== lastSeq + 1) {
          console.warn(`Sequence gap: expected ${lastSeq + 1}, got ${msg.seq}`);
        }
        lastSeq = msg.seq;

        // Decode Base64 → ArrayBuffer → AudioBuffer
        decodeAndSchedule(msg.data, msg.seq);
      } else if (msg.type === 'stop') {
        console.log('Received stop command');
        nextPlayTime = 0;
        chunksPlayed = 0;
        lastSeq = -1;
        updateStatus('Stopped');
      } else if (msg.type === 'ping') {
        // Respond with status for diagnostics
        context.sendCustomMessage(NAMESPACE, event.senderId, {
          type: 'pong',
          chunksReceived: chunksReceived,
          chunksPlayed: chunksPlayed,
          currentTime: audioCtx.currentTime,
          nextPlayTime: nextPlayTime,
          state: audioCtx.state
        });
      }
    });

    /**
     * Decodes a Base64-encoded WAV chunk and schedules it for gapless playback.
     * Uses manual WAV parsing instead of decodeAudioData() for maximum
     * compatibility with Cast device Chromium environments.
     *
     * @param {string} base64Data - Base64-encoded WAV file (header + PCM)
     * @param {number} seq - Sequence number for logging
     */
    function decodeAndSchedule(base64Data, seq) {
      try {
        // Resume AudioContext if suspended (Chrome autoplay policy)
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().then(() => console.log('AudioContext resumed'));
        }

        // Decode Base64 to Uint8Array
        const binaryStr = atob(base64Data);
        const len = binaryStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        // Parse WAV header manually (44 bytes)
        // Byte offsets: 22=channels(2), 24=sampleRate(4), 34=bitsPerSample(2), 40=dataSize(4)
        const view = new DataView(bytes.buffer);
        const channels = view.getUint16(22, true);
        const sampleRate = view.getUint32(24, true);
        const bitsPerSample = view.getUint16(34, true);
        const dataSize = view.getUint32(40, true);
        const headerSize = 44;

        // Convert 16-bit PCM to Float32 (-1.0 to +1.0)
        const samplesPerChannel = dataSize / (channels * (bitsPerSample / 8));
        const audioBuffer = audioCtx.createBuffer(channels, samplesPerChannel, sampleRate);

        for (let ch = 0; ch < channels; ch++) {
          const channelData = audioBuffer.getChannelData(ch);
          for (let i = 0; i < samplesPerChannel; i++) {
            // Interleaved 16-bit little-endian: sample[i] has ch0 then ch1
            const byteOffset = headerSize + (i * channels + ch) * 2;
            const sample = view.getInt16(byteOffset, true);
            channelData[i] = sample / 32768.0;
          }
        }

        scheduleBuffer(audioBuffer);

        if (chunksPlayed <= 5 || chunksPlayed % 50 === 0) {
          console.log(`Chunk ${seq}: ${samplesPerChannel} samples, ${audioBuffer.duration.toFixed(3)}s, ` +
            `scheduled at ${nextPlayTime.toFixed(3)}s, current: ${audioCtx.currentTime.toFixed(3)}s, ` +
            `ahead: ${(nextPlayTime - audioCtx.currentTime).toFixed(3)}s, ` +
            `audioCtx.state: ${audioCtx.state}`);
        }
      } catch (err) {
        console.error(`Failed to process chunk ${seq}:`, err);
      }
    }

    /**
     * Schedules an AudioBuffer for gapless playback.
     *
     * Buffers are scheduled at precise times using AudioBufferSourceNode.start(time).
     * Each buffer's start time is exactly after the previous buffer ends, ensuring
     * seamless audio without gaps or overlaps.
     *
     * If playback falls too far behind (buffer underrun), the schedule resets
     * to play from "now" to recover quickly.
     *
     * @param {AudioBuffer} audioBuffer - Decoded audio buffer to schedule
     */
    function scheduleBuffer(audioBuffer) {
      const now = audioCtx.currentTime;
      const bufferDuration = audioBuffer.duration;

      // Reset schedule if we've fallen behind or this is the first chunk.
      // Add a small initial buffer (50ms) to absorb jitter.
      if (nextPlayTime < now) {
        if (chunksPlayed > 0) {
          console.warn(`Buffer underrun: nextPlayTime ${nextPlayTime.toFixed(3)} < now ${now.toFixed(3)}, resetting`);
        }
        nextPlayTime = now + 0.05; // 50ms initial buffer
      }

      // Create and schedule the source node
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.start(nextPlayTime);

      // Advance schedule for the next chunk
      nextPlayTime += bufferDuration;
      chunksPlayed++;

      updateStatus(`Playing — chunk ${chunksPlayed}, ahead: ${(nextPlayTime - now).toFixed(1)}s`);
    }

    /**
     * Updates the on-screen status text (visible if receiver has a display).
     * @param {string} text - Status message
     */
    function updateStatus(text) {
      const el = document.getElementById('info');
      if (el) el.textContent = text;
    }

    /**
     * Play a 1-second 440Hz test tone through Web Audio API.
     * If you hear this on the Cast device, AudioContext.destination works.
     */
    function playTestTone() {
      console.log('Playing test tone (440Hz, 1s) via Web Audio API...');
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 440;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 1.0);
      osc.onended = () => {
        console.log('Test tone finished');
        updateStatus('Test tone done — waiting for audio chunks...');
      };
    }

    // Start the receiver
    context.start(options);
    console.log('Direct Channel receiver started, listening on', NAMESPACE);
    console.log('AudioContext state:', audioCtx.state, 'sampleRate:', audioCtx.sampleRate);
    console.log('AudioContext destination:', audioCtx.destination.channelCount, 'channels,',
      'maxChannelCount:', audioCtx.destination.maxChannelCount);

    // Monitor AudioContext state changes
    audioCtx.onstatechange = () => {
      console.log('AudioContext state changed to:', audioCtx.state);
    };

    // Resume AudioContext and play test tone after a short delay
    // Cast devices may need explicit resume before any audio output
    setTimeout(async () => {
      if (audioCtx.state === 'suspended') {
        console.log('AudioContext suspended, attempting resume...');
        await audioCtx.resume();
        console.log('AudioContext resumed, state:', audioCtx.state);
      }
      playTestTone();
    }, 500);
  </script>
</body>
</html>
