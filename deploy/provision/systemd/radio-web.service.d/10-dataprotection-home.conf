[Service]
# FALLBACK drop-in — provision.sh installs this only when the deployed
# /etc/systemd/system/radio-web.service is missing the value (i.e. predates the
# fold into deploy/common/radio-web.service). See that unit for the full
# rationale: ProtectHome=true masks /home read-only while HOME still points into
# it, so anything falling back to $HOME fails with EROFS.
#
# /opt/radio-console/data (not /opt/radio-console) because ProtectSystem=strict
# leaves only the ReadWritePaths entries writable.
Environment=HOME=/opt/radio-console/data
