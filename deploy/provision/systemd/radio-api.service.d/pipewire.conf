[Service]
# PipeWire access for Bluetooth audio capture (pw-record, pw-cli).
# PipeWire socket lives at /run/user/1000/pipewire-0 (mmack user session).
# ProtectHome=true (main unit) mounts tmpfs over /run/user, hiding PipeWire socket.
# ProtectSystem=strict (main unit) makes filesystem read-only.
# Override both to allow access. ReadWritePaths still limits to /opt/radio-console.
Environment=XDG_RUNTIME_DIR=/run/user/1000
ProtectSystem=false
ProtectHome=false
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
