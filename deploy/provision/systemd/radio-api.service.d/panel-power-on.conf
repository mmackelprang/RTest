# Fallback drop-in for a box whose installed radio-api.service predates ENC-22.
# The canonical unit (deploy/common/radio-api.service) carries the same ExecStopPost= line; this
# file is installed by provision.sh ONLY when the main unit lacks it (reconcile_dropin, needle
# "PowerSaveMode"), so the two are never both active. If you later install the canonical unit on
# a box that has this drop-in, delete this file - ExecStopPost= lines accumulate, and the command
# would run twice (harmless, but it is drift).
#
# Why: radio-api can power the kiosk panel off after a period on the sleep screen (ENC-22), and the
# rotary encoder is then the only wake source. A dark panel must not outlive the process that can
# wake it. See the comment block in deploy/common/radio-api.service.
# VERIFY after installing: systemctl show radio-api -p ExecStopPost
[Service]
ExecStopPost=-/usr/bin/env DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus /usr/bin/gdbus call --session --timeout 5 --dest org.gnome.Mutter.DisplayConfig --object-path /org/gnome/Mutter/DisplayConfig --method org.freedesktop.DBus.Properties.Set org.gnome.Mutter.DisplayConfig PowerSaveMode "<0>"
