# Route Bluetooth A2DP input streams to the bt_capture null sink.
#
# Without this rule, PipeWire auto-links bluez_input streams to the default
# audio output (headphones/speakers). By targeting bt_capture instead, the
# audio goes through our application's capture pipeline first, which adds
# visualization, fingerprinting, and volume control before outputting to
# the real hardware sink.
#
# Requires: bt-capture-sink.conf (PipeWire null sink)
# Install to: ~/.config/wireplumber/wireplumber.conf.d/51-bt-capture-routing.conf

monitor.bluez.rules = [
    {
        matches = [
            {
                node.name = "~bluez_input.*"
            }
        ]
        actions = {
            update-props = {
                node.target = "bt_capture"
            }
        }
    }
]
