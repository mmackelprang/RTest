# Enable A2DP sink role so the Pi can RECEIVE audio from phones.
#
# By default PipeWire/BlueZ only acts as an A2DP source (sender).
# Adding a2dp_sink to the roles list registers the Audio Sink SDP record
# so phones see the Pi as a Bluetooth speaker/audio receiver.
#
# Seat monitoring MUST be disabled: on Raspberry Pi OS, LightDM crash-cycles
# cause WirePlumber's logind plugin to report seat state "online" (not "active"),
# which prevents the BlueZ monitor from initializing. Disabling seat monitoring
# ensures the BlueZ monitor starts unconditionally regardless of seat state.
#
# Codecs are pinned to SBC/SBC-XQ: vendor-specific codecs (AAC, LDAC, aptX)
# negotiate successfully but the AVDTP transport stays "idle" and START is
# rejected with "Bad State (49)". Pinning to SBC avoids this.
#
# Install to: ~/.config/wireplumber/wireplumber.conf.d/50-bluez-a2dp-sink.conf

wireplumber.profiles = {
    main = {
        monitor.bluez.seat-monitoring = disabled
    }
}

monitor.bluez.properties = {
    bluez5.roles = [ a2dp_sink, a2dp_source ]
    bluez5.codecs = [ sbc, sbc_xq ]
    bluez5.enable-sbc-xq = true
    bluez5.hfphsp-backend = "native"
}
