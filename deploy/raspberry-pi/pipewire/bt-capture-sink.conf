# PipeWire virtual null sink for Bluetooth A2DP audio capture.
#
# When a phone streams audio to the Pi via Bluetooth A2DP, PipeWire creates
# a bluez_input stream that normally routes directly to the default audio
# output. This null sink intercepts that audio so our application can capture
# it from the monitor source (bt_capture.monitor), process it through the
# audio pipeline (visualization, fingerprinting, volume control), and output
# it to the real hardware sink.
#
# Install to: ~/.config/pipewire/pipewire.conf.d/bt-capture-sink.conf

context.objects = [
    {
        factory = adapter
        args = {
            factory.name   = support.null-audio-sink
            node.name       = "bt_capture"
            node.description = "Bluetooth Audio Capture"
            media.class     = Audio/Sink
            object.linger   = true
            audio.position  = [ FL FR ]
            audio.rate      = 48000
            monitor.channel-volumes = true
            monitor.passthrough     = true
            priority.session = 0
            priority.driver  = 0
            node.passive     = true
        }
    }
]
