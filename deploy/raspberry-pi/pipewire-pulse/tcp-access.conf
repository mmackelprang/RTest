# Allow cross-user access to PipeWire-Pulse via TCP.
# The radio system user cannot connect to PipeWire's Unix socket (peer UID check),
# so we enable TCP on localhost:4713 to allow ALSA's PulseAudio plugin to connect.
# This lets MiniAudio enumerate PipeWire sinks/sources (including bt_capture.monitor)
# from the radio-api service running as the 'radio' user.
pulse.properties = {
    server.address = [
        "unix:native"
        "tcp:4713"
    ]
}
